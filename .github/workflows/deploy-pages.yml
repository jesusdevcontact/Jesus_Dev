name: Deploy Angular portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Angular app
        run: pnpm build:pages

      - name: Verify Pages artifact
        run: |
          artifact="dist/jesusdev-portfolio/browser"
          test -f "$artifact/index.html"
          test -f "$artifact/404.html"
          test -f "$artifact/contact/index.html"
          test -f "$artifact/legal/index.html"
          test -f "$artifact/privacy/index.html"
          test -f "$artifact/cookies/index.html"
          test -f "$artifact/projects/aprende-con-jesus-dev/index.html"
          test -f "$artifact/projects/focusflow/index.html"
          test -f "$artifact/projects/connectingdevs/index.html"
          test -f "$artifact/projects/gibora/index.html"
          test -f "$artifact/projects/pegasus-medical/index.html"
          test -f "$artifact/CNAME"
          test -f "$artifact/.nojekyll"
          test -d "$artifact/assets"
          grep -qx "jesusdev.dev" "$artifact/CNAME"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/contact/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/legal/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/privacy/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/cookies/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/projects/aprende-con-jesus-dev/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/projects/focusflow/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/projects/connectingdevs/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/projects/gibora/index.html"
          grep -Eq 'main-[A-Z0-9]+\.js' "$artifact/projects/pegasus-medical/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jesusdev-portfolio/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
