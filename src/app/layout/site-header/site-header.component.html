<header class="site-header" [class.site-header--scrolled]="scrolled()">
  <div class="container nav-shell">
    <a class="brand" href="/#hero" [attr.aria-label]="'accessibility.home' | translate" (click)="closeMenu()">
      <span class="brand-mark">
        <img src="assets/img/jesus_dev_logo.png" alt="" width="36" height="36">
      </span>
      <span class="brand-copy">
        <strong>Jesus Dev</strong>
        <span>{{ 'nav.brandSubtitle' | translate }}</span>
      </span>
    </a>

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      [attr.aria-label]="'accessibility.toggleNavigation' | translate"
      (click)="toggleMenu()"
    >
      <svg [lucideIcon]="menuIcon()" size="20" aria-hidden="true"></svg>
    </button>

    <nav id="primary-navigation" class="site-nav" [class.site-nav--open]="menuOpen()" [attr.aria-label]="'accessibility.primaryNavigation' | translate">
      @for (item of navItems; track item.target) {
        <a [href]="navHref(item.target)" (click)="closeMenu()">{{ item.labelKey | translate }}</a>
      }
    </nav>

    <div class="nav-preferences">
      <button
        class="theme-toggle-mobile"
        type="button"
        [attr.aria-label]="'accessibility.themeToggle' | translate: { theme: ('theme.' + theme.nextTheme() + 'Label' | translate) }"
        [attr.title]="'accessibility.themeToggle' | translate: { theme: ('theme.' + theme.nextTheme() + 'Label' | translate) }"
        (click)="toggleTheme()"
      >
        <svg [lucideIcon]="theme.icon()" size="16" aria-hidden="true"></svg>
        <span>{{ 'theme.' + theme.nextTheme() + 'Label' | translate }}</span>
      </button>

      <div class="theme-switcher" role="group" [attr.aria-label]="'accessibility.themeSwitcher' | translate">
        <button
          type="button"
          [class.is-active]="theme.theme() === 'dark'"
          [attr.aria-pressed]="theme.theme() === 'dark'"
          [attr.aria-label]="'accessibility.themeDark' | translate"
          (click)="setTheme('dark')"
        >
          <svg lucideIcon="moon" size="15" aria-hidden="true"></svg>
          <span>{{ 'theme.darkLabel' | translate }}</span>
        </button>
        <button
          type="button"
          [class.is-active]="theme.theme() === 'light'"
          [attr.aria-pressed]="theme.theme() === 'light'"
          [attr.aria-label]="'accessibility.themeLight' | translate"
          (click)="setTheme('light')"
        >
          <svg lucideIcon="sun" size="15" aria-hidden="true"></svg>
          <span>{{ 'theme.lightLabel' | translate }}</span>
        </button>
      </div>

      <div class="language-switcher" role="group" [attr.aria-label]="'accessibility.languageSwitcher' | translate">
        @for (language of i18n.languages; track language) {
          <button
            type="button"
            [class.is-active]="i18n.currentLanguage() === language"
            [attr.aria-pressed]="i18n.currentLanguage() === language"
            [attr.aria-label]="('accessibility.languageOption' | translate: { language: ('languages.' + language | translate) })"
            (click)="changeLanguage(language)"
          >
            {{ language.toUpperCase() }}
          </button>
        }
      </div>
    </div>
  </div>
</header>
