<header class="site-header" [class.site-header--scrolled]="scrolled()">
  <div class="container nav-shell">
    <a class="brand" href="#hero" aria-label="Jesus Dev home" (click)="closeMenu()">
      <span class="brand-mark">
        <img src="assets/img/jesus_dev_logo.png" alt="" width="36" height="36">
      </span>
      <span class="brand-copy">
        <strong>Jesus Dev</strong>
        <span>Angular / Laravel</span>
      </span>
    </a>

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <svg [lucideIcon]="menuIcon()" size="20" aria-hidden="true"></svg>
    </button>

    <nav id="primary-navigation" class="site-nav" [class.site-nav--open]="menuOpen()" aria-label="Primary">
      @for (item of navItems; track item.target) {
        <a [href]="'#' + item.target" (click)="closeMenu()">{{ item.label }}</a>
      }
      <a class="nav-contact" href="mailto:jesusdevcontact@gmail.com" (click)="closeMenu()">Hire me</a>
    </nav>
  </div>
</header>
