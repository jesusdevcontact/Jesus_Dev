<div class="cookie-consent">
  <button
    #settingsButton
    class="cookie-fab"
    type="button"
    [attr.aria-label]="'cookies.openSettings' | translate"
    [attr.aria-expanded]="panelOpen()"
    (click)="openSettings()"
  >
    <svg lucideIcon="cookie" size="18" aria-hidden="true"></svg>
  </button>

  @if (panelOpen()) {
    <section
      class="cookie-panel"
      role="dialog"
      aria-modal="false"
      aria-labelledby="cookie-title"
      aria-describedby="cookie-description"
    >
      <div class="cookie-copy">
        <p class="eyebrow">{{ 'cookies.eyebrow' | translate }}</p>
        <div class="cookie-heading">
          <h2 id="cookie-title">{{ 'cookies.title' | translate }}</h2>
          <button
            class="cookie-close"
            type="button"
            [attr.aria-label]="(hasConsent() ? 'cookies.closeSaved' : 'cookies.close') | translate"
            (click)="closePanel()"
          >
            <svg lucideIcon="x" size="16" aria-hidden="true"></svg>
          </button>
        </div>
        <p id="cookie-description">{{ 'cookies.description' | translate }}</p>
        @if (hasConsent()) {
          <p class="cookie-status" aria-live="polite">
            {{ (noticeAccepted() ? 'cookies.statusAccepted' : 'cookies.statusRejected') | translate }}
          </p>
        }
      </div>

      <div class="cookie-actions">
        <button
          #acceptButton
          type="button"
          class="cookie-button cookie-button--primary"
          [class.is-selected]="noticeAccepted()"
          [attr.aria-label]="'cookies.acceptLabel' | translate"
          (click)="accept()"
        >
          {{ 'cookies.accept' | translate }}
        </button>
        <button
          type="button"
          class="cookie-button"
          [class.is-selected]="hasConsent() && !noticeAccepted()"
          [attr.aria-label]="'cookies.rejectLabel' | translate"
          (click)="reject()"
        >
          {{ 'cookies.reject' | translate }}
        </button>
      </div>
    </section>
  }
</div>
