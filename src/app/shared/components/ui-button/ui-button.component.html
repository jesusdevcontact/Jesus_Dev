<a
  class="ui-button"
  [ngClass]="'ui-button--' + variant()"
  [href]="href()"
  [attr.aria-label]="ariaLabel() || label()"
  [attr.target]="external() ? '_blank' : null"
  [attr.rel]="external() ? 'noopener noreferrer' : null"
>
  <span>{{ label() }}</span>
  <svg [lucideIcon]="iconName()" size="18" aria-hidden="true"></svg>
</a>
